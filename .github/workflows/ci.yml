name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loxofit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loxofit
      POSTGRES_SERVER: localhost
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-experiments.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q
      - name: Docs are up to date
        run: |
          python ../docs/generate.py --no-render
          git diff --exit-code -- ../docs/generated || {
            echo "::error::docs/generated is out of date - run 'just docs --no-render' and commit"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npx prettier --check src
      - name: Lint
        run: npx oxlint src
      - name: Types and build
        run: npm run build